[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "camel"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = ["black", "livereload"]

[project.optional-dependencies]
test = ["pytest", "hypothesis"]

[project.scripts]
cml = "camel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["camel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
